services:
  fastapi:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: fastapi_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - app-network

  react:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: react_app
    ports:
      - "5173:5173"
    networks:
      - app-network
    depends_on:
      - fastapi
    environment:
      VITE_DEV_PROXY_TARGET: "http://fastapi:8000"

networks:
  app-network:
    driver: bridge
